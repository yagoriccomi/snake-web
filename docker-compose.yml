# Ambiente local do snake-web.
#
# O banco NÃO sobe aqui: é o mesmo Supabase local do app Android DEV, que a
# Supabase CLI orquestra no repositório `snake-thai` (`scripts\db-dev start`).
# Subir outro banco aqui daria dois bancos diferentes contando a mesma turma.
services:
  web:
    build: .
    container_name: snake-web-dev
    ports:
      - '3001:3001'
    volumes:
      # Código montado para recarregar ao salvar; node_modules e .next ficam no
      # contêiner, senão o do Windows sobrescreve o do Linux e o build quebra.
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      # Sem isto NÃO HÁ recarga ao salvar. O código vem por bind mount do
      # Windows, e o evento de "arquivo mudou" não atravessa para o Linux do
      # contêiner: o observador precisa perguntar, em vez de esperar o aviso.
      # O sintoma é traiçoeiro — o arquivo novo está lá dentro, mas o servidor
      # continua entregando o compilado antigo, e parece que a edição sumiu.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    extra_hosts:
      # O navegador alcança o Supabase em localhost:55321; se algum dia algo
      # precisar sair do contêiner, sai por aqui.
      - 'host.docker.internal:host-gateway'
